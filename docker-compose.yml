services:
  db:
    image: mysql:8.4
    container_name: sap-elearning-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sap_academy}
      MYSQL_USER: ${MYSQL_USER:-sap_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sap-elearning-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: mysql://${MYSQL_USER:-sap_user}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-sap_academy}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data

volumes:
  mysql_data:
